<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="color-scheme" content="dark" />
  <title>RWEngine · Shared report</title>
  <link rel="stylesheet" href="/share/share.css?v=4" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">RWEngine</a>
      <span>Public report</span>
    </div>
  </header>

  <main class="report-shell">
    <div id="loadingState" class="state">Loading report…</div>
    <div id="errorState" class="state error hidden"></div>

    <article id="reportView" class="hidden">
      <header class="report-head">
        <div>
          <p id="reportMeta" class="kicker">Ranked war</p>
          <h1 id="reportTitle">War report</h1>
          <p id="reportDate"></p>
        </div>
        <span class="read-only">Read only</span>
      </header>

      <section id="warPublicBody">
        <div id="scoreLine" class="score-line"></div>
        <div id="summaryGrid" class="summary-grid"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Member</th>
                <th>Hits</th>
                <th>Assists</th>
                <th>Outside</th>
                <th>Score +</th>
                <th>Score -</th>
                <th>Net</th>
              </tr>
            </thead>
            <tbody id="memberRows"></tbody>
          </table>
        </div>
      </section>

      <section id="playerPublicBody" class="hidden">
        <div id="playerSummaryGrid" class="summary-grid"></div>
        <div id="playerPublicContext" class="public-context"></div>
        <div id="playerPublicSources" class="public-sources"></div>
        <section class="public-war-history">
          <header>Recent wars</header>
          <div id="playerPublicWars"></div>
        </section>
      </section>

      <footer class="report-foot">
        <span>RWEngine public link</span>
        <span id="sharedAt"></span>
      </footer>
    </article>
  </main>

  <script type="module" src="/share/share.js?v=3"></script>
</body>
</html>
