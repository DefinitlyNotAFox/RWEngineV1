<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="color-scheme" content="dark" />
  <title>RWEngine · Shared report</title>
  <link rel="stylesheet" href="/share/share.css?v=7" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">RWEngine</a>
      <span>Public report</span>
    </div>
  </header>

  <main class="report-shell">
    <div id="loadingState" class="state">Loading report…</div>
    <div id="errorState" class="state error hidden"></div>

    <article id="reportView" class="hidden">
      <header class="report-head">
        <div>
          <p id="reportMeta" class="kicker">Ranked war</p>
          <h1 id="reportTitle">War report</h1>
          <p id="reportDate"></p>
        </div>
        <span class="read-only">Read only</span>
      </header>

      <div id="scoreLine" class="score-line"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Member</th>
              <th>Hits</th>
              <th>Assists</th>
              <th>Outside hits</th>
              <th>Score gained</th>
              <th>Score lost</th>
              <th>Net score</th>
            </tr>
          </thead>
          <tbody id="memberRows"></tbody>
        </table>
      </div>

      <footer class="report-foot">
        <span>RWEngine public link</span>
        <span id="sharedAt"></span>
      </footer>
    </article>
  </main>

  <script type="module" src="/share/share.js?v=4"></script>
</body>
</html>
