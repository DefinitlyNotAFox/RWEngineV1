name: Validate RWEngine

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          printf '{"type":"module"}\n' > package.json
          find v2 functions share -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/intel-insights.test.mjs
          node tests/intel-contract.test.mjs
          node tests/player-analysis-contract.test.mjs
          node tests/player-report-public.test.mjs
          rm package.json

      - name: Check v2 asset references
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          pages = [Path("v2/index.html"), Path("v2/intel-preview.html"), Path("share/index.html")]
          refs = []

          for page in pages:
              html = page.read_text(encoding="utf-8")
              refs.extend(re.findall(r'(?:src|href)="(/(?:v2|share)/[^"?]+)(?:\?[^"]*)?"', html))

          missing = [ref for ref in refs if not Path(ref.lstrip("/")).exists()]

          if missing:
              print("Missing referenced assets:")
              for ref in missing:
                  print(f" - {ref}")
              sys.exit(1)

          print(f"Validated {len(refs)} application asset references.")

          js_files = list(Path("v2").glob("*.js"))
          missing_imports = []

          for js_file in js_files:
              source = js_file.read_text(encoding="utf-8")
              for rel in re.findall(r"from\s+['\"](\./[^'\"]+)['\"]", source):
                  target = (js_file.parent / rel).resolve()
                  if not target.exists():
                      missing_imports.append(f"{js_file}: {rel}")

          if missing_imports:
              print("Missing frontend module imports:")
              for item in missing_imports:
                  print(f" - {item}")
              sys.exit(1)

          print(f"Validated relative imports in {len(js_files)} frontend modules.")
