name: Validate RWEngine

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          printf '{"type":"module"}\n' > package.json
          find v2 functions share -name '*.js' -print0 | xargs -0 -n1 node --check
          node tests/intel-insights.test.mjs
          node tests/intel-contract.test.mjs
          node tests/player-analysis-contract.test.mjs
          node tests/player-report-public.test.mjs
          rm package.json

      - name: Validate SQLite schema and migrations
        shell: python
        run: |
          from pathlib import Path
          import sqlite3
          import sys
          import tempfile

          migrations = sorted(Path("migrations").glob("*.sql"))
          expected_names = [f"{i:03d}_" for i in range(1, len(migrations) + 1)]

          for path, prefix in zip(migrations, expected_names):
              if not path.name.startswith(prefix):
                  print(f"Migration sequence mismatch: expected prefix {prefix}, got {path.name}")
                  sys.exit(1)

          with tempfile.TemporaryDirectory() as tmp:
              db_path = Path(tmp) / "rwengine-validation.sqlite"
              connection = sqlite3.connect(db_path)
              connection.execute("PRAGMA foreign_keys = ON")

              try:
                  connection.executescript(Path("schema.sql").read_text(encoding="utf-8"))

                  integrity = connection.execute("PRAGMA integrity_check").fetchone()[0]
                  if integrity != "ok":
                      raise RuntimeError(f"Base schema integrity check failed: {integrity}")

                  for migration in migrations:
                      try:
                          connection.executescript(migration.read_text(encoding="utf-8"))
                      except Exception as error:
                          raise RuntimeError(f"{migration} failed: {error}") from error

                  integrity = connection.execute("PRAGMA integrity_check").fetchone()[0]
                  if integrity != "ok":
                      raise RuntimeError(f"Post-migration integrity check failed: {integrity}")

                  foreign_key_errors = connection.execute("PRAGMA foreign_key_check").fetchall()
                  if foreign_key_errors:
                      raise RuntimeError(f"Foreign-key check failed: {foreign_key_errors[:10]}")

                  required = {
                      "faction_members": {"faction_id", "player_id", "is_current"},
                      "member_snapshots": {
                          "faction_id", "player_id", "snapshot_at",
                          "activity_total_seconds", "xanax_taken_total",
                          "battle_stats_estimate"
                      },
                      "resource_permissions": {
                          "owner_user_id", "faction_id", "resource_type",
                          "resource_key", "visibility"
                      },
                      "analysis_snapshots": {
                          "owner_user_id", "faction_id", "target_player_id",
                          "payload_json", "created_at"
                      }
                  }

                  for table, columns in required.items():
                      found = {
                          row[1]
                          for row in connection.execute(f"PRAGMA table_info({table})").fetchall()
                      }
                      missing = columns - found
                      if missing:
                          raise RuntimeError(
                              f"{table} is missing required columns: {sorted(missing)}"
                          )

                  print(
                      f"Validated schema.sql plus {len(migrations)} migrations "
                      "with SQLite integrity and foreign-key checks."
                  )
              finally:
                  connection.close()

      - name: Check v2 asset references
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          pages = [Path("v2/index.html"), Path("v2/intel-preview.html"), Path("share/index.html")]
          refs = []

          for page in pages:
              html = page.read_text(encoding="utf-8")
              refs.extend(re.findall(r'(?:src|href)="(/(?:v2|share)/[^"?]+)(?:\?[^"]*)?"', html))

          missing = [ref for ref in refs if not Path(ref.lstrip("/")).exists()]

          if missing:
              print("Missing referenced assets:")
              for ref in missing:
                  print(f" - {ref}")
              sys.exit(1)

          print(f"Validated {len(refs)} application asset references.")

          js_files = list(Path("v2").glob("*.js"))
          missing_imports = []

          for js_file in js_files:
              source = js_file.read_text(encoding="utf-8")
              for rel in re.findall(r"from\s+['\"](\./[^'\"]+)['\"]", source):
                  target = (js_file.parent / rel).resolve()
                  if not target.exists():
                      missing_imports.append(f"{js_file}: {rel}")

          if missing_imports:
              print("Missing frontend module imports:")
              for item in missing_imports:
                  print(f" - {item}")
              sys.exit(1)

          print(f"Validated relative imports in {len(js_files)} frontend modules.")
